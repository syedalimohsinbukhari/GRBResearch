# Source-of-truth registry for every figure PNG the paper actually uses (codes-for-paper/
# sync_paper_assets.py reads this, alongside table_registry.yaml).
#
# `source` is relative to GRBResearchWork/, `dest` is relative to GRBResearchPaper/ -- the
# "chapter" (section) folder it belongs in. Only PNG is tracked: pdflatex prefers .pdf when both
# exist, but this paper's images/ only ever kept the .png copy, so that's the one that matters.
#
# Same convention as seed_registry.yaml: a figure is never silently dropped from this file.
#   active -- copied by the runner.
#   unused -- has a real source in codes-for-paper/, but isn't referenced by any figure in the
#               current draft (matches seed_registry.yaml's `unused` entries where applicable).
#   no_known_source -- exists in GRBResearchPaper/images/ today, but no generating script was
#               found in GRBResearchWork during a search of this repo; not auto-copyable, so not
#               the runner's job -- listed so it's clear this was checked, not missed.

active:
    all_safe_unsafe:
        source: codes-for-paper/all-safe-unsafe/all-safe-unsafe.png
        dest: images/section4/all-safe-unsafe.png
    amati_relationship:
