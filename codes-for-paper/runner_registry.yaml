# Canonical list of this project's real pipeline scripts -- the ones that read results.json (or similar raw data) and
# produce a committed CSV/plot/table.
# codes-for-paper/runner_all.py reads this and runs each one as a real subprocess (exactly how a human would run it),
# so a full-pipeline rebuild (e.g., after a shared constant like N_GRID changes) is one command instead of re-deriving
# the list from memory every time.
#
# Order matters only for same-topic pairs: a `csv_to_latex.py` reads the CSV the script right before it just wrote,
# so it must run after that script, not before.
# Everything else here is independent and order-agnostic.
scripts:
    -   path: fluence/grb_fluence.py
        note: GBM fluence CSV
    -   path: fluence/csv_to_latex.py
        note: GBM fluence table (reads grb_fluence.py's CSV)
    -   path: fluence/flux_energyFlux.py
        note: >-
            Flux vs. energy-flux plot (reads fluence/flux_energy_flux.csv; no MC, no seed). Not referenced by any
            figure in the current draft, still a real pipeline script -- included for a complete rebuild
    -   path: variability_analysis/fitter_GRB080916C.py
        note: >-
            Norris-pulse joint fit -> norris_fit_results_GRB080916C.csv (measured t_v, feeds
            lorentz_factor.py/lorentz_factor_limit_b.py below -- must run before both)
    -   path: variability_analysis/fitter_GRB131014A.py
        note: Norris-pulse joint fit, GRB131014A (no redshift; measured t_v feeds lorentz_factor_unknown_z.py -- must run before it)
    -   path: variability_analysis/fitter_GRB140206B.py
        note: Norris-pulse joint fit, GRB140206B (no redshift; measured t_v feeds lorentz_factor_unknown_z.py -- must run before it)
    -   path: variability_analysis/fitter_GRB231129C.py
        note: Norris-pulse joint fit, GRB231129C (no redshift; measured t_v feeds lorentz_factor_unknown_z.py -- must run before it)
    -   path: lorentz_factor/lorentz_factor.py
        note: >-
            Lorentz factor Limit A; reads fitter_GRB*.py's norris_fit_results_GRB*.csv for
            measured t_v (falls back to episode duration otherwise). Writes lorentz_results.csv,
            then shells out to generate_lorentz_table.py itself (subprocess) to render
            lorentz_table.tex -- that generator is not a separate runner_all.py step, unlike the
            fluence/bb_fraction/photospheric_radius csv_to_latex.py scripts above, which are.
    -   path: lorentz_factor/lorentz_factor_limit_b.py
        note: >-
            Lorentz factor Limit B (independent seed from Limit A by design; no run-order
            dependency on it, but same norris_fit_results_GRB*.csv dependency as Limit A above).
            Also self-chains into generate_lorentz_table_limit_b.py via subprocess.
    -   path: lorentz_factor/generate_lorentz_table_combined.py
        note: >-
            Join-only combined Limit A + Limit B table (lorentz_table_combined.tex); recomputes nothing and
            reads lorentz_results.csv and lorentz_results_limit_b.csv, so it must run after both
            lorentz_factor.py and lorentz_factor_limit_b.py above.
    -   path: lorentz_factor/lorentz_factor_unknown_z.py
        note: >-
            Lorentz factor Limit A swept over assumed z = 1, 3, 5, 7 for the three no-redshift bursts
            (same norris_fit_results_GRB*.csv dependency as above). Writes lorentz_results_unknown_z.csv
            and self-chains into generate_lorentz_table_unknown_z.py (arg A) via subprocess. Also defines
            run_sweep(), which the Limit B script below imports.
    -   path: lorentz_factor/lorentz_factor_limit_b_unknown_z.py
        note: >-
            Lorentz factor Limit B swept over the same z values (independent seed from the Limit A sweep by
            design; imports run_sweep() from lorentz_factor_unknown_z.py, so no run-order dependency on it).
            Writes lorentz_results_limit_b_unknown_z.csv and self-chains into
            generate_lorentz_table_unknown_z.py (arg B).
    -   path: gamma_min_reconciliation/reconcile_tv.py
        note: >-
            Prints the literature-Gamma_min t_v reconciliation cited in section-6-discussion.tex (reads
            lorentz_factor.py's CSV, so it must run after it); stdout only, no committed output file --
            rerun to reconfirm the paper's "t_v ~= 1.7 s" claim still holds if lorentz_results.csv changes
    -   path: gbm_only_refit/gbm_only_refit.py
        note: GBM-only refit comparison
    -   path: gbm_only_refit/gbm_only_refit_3way.py
        note: >-
            GRB131014A three-way refit comparison (joint / GBM-only / GBM-only NaI >= 40 keV); imports helpers from
            gbm_only_refit.py but writes its own separate CSV/figures. Not referenced by any figure in the current
            draft (seed_registry `unused`) -- included for a complete rebuild
    -   path: bb_fraction/bb_flux_fraction.py
        note: Blackbody flux fraction CSV
    -   path: bb_fraction/csv_to_latex.py
        note: Blackbody flux fraction table (reads bb_flux_fraction.py's CSV)
    -   path: photospheric_radius/pe_er_photosphere.py
        note: Photospheric radius / Lorentz factor CSV (Pe'er 2007)
    -   path: photospheric_radius/csv_to_latex.py
        note: Photospheric radius table (reads pe_er_photosphere.py's CSV)
    -   path: lorentz_factor/gamma_comparison_plot.py
        note: >-
            GRB080916C Limit A / Limit B / thermal Gamma comparison figure (fig:gamma_comparison); reads
            lorentz_results.csv, lorentz_results_limit_b.csv and photospheric_radius/pe_er_photosphere.csv, so it must run
            after all three of their scripts. No MC of its own, so no seed_registry entry
    -   path: lorentz_factor/gamma_comparison_unknown_z_plot.py
        note: >-
            Limit A / Limit B / thermal Gamma vs. assumed z for the three no-redshift bursts, all three as curves (reads the two
            lorentz_curves_*_unknown_z.csv files from the sweep scripts above and photospheric_radius/pe_er_photosphere.csv, so it
            must run after all three; no MC of its own, so
            no seed_registry entry)
    -   path: model_parameters/epeak_vs_kt.py
        note: kT-Epeak correlation (not currently used in the paper, still a real pipeline script)
    -   path: model_parameters/peak_energy.py
        note: Peak energy distribution
    -   path: model_parameters/low_index.py
        note: Low-energy spectral index distribution (no MC/N_GRID; included for a complete rebuild)
    -   path: model_parameters/high_index.py
        note: High-energy spectral index distribution (no MC/N_GRID; included for a complete rebuild)
    -   path: amati_relationship/amati_relationship.py
        note: Amati relation CSV (writes amati_relationship.csv and amati_relationship_unknown_z.csv)
    -   path: amati_relationship/csv_to_latex.py
        note: Amati relation table, GRB080916C (reads amati_relationship.py's amati_relationship.csv)
    -   path: amati_relationship/csv_to_latex_unknown_z.py
        note: >-
            Amati relation table, the three no-redshift bursts (reads amati_relationship.py's
            amati_relationship_unknown_z.csv) -- separate table from csv_to_latex.py above since
            these bursts need one Eiso column per swept z, not one Ep/Eiso point per episode
    -   path: butterfly_plots/butterfly_all.py
        note: Butterfly SEDs
    -   path: all-safe-unsafe/all-safe-unsafe.py
        note: SAFE/NOK model-fit summary (no MC/N_GRID; included for a complete rebuild)
    -   path: time_integrated_table/time_integrated_table.py
        note: >-
            Time-integrated/time-resolved duration appendix table (no MC/N_GRID; reads results.json
            interval strings directly, no CSV involved -- included for a complete rebuild)

# Deliberately excluded, not forgotten -- the same active / unused / dormant-style transparency as seed_registry.yaml:
#   variability_analysis/norris..py -- dormant, no caller anywhere in codes-for-paper/.
#   LAT_analysis/txt_to_csv.py, csv_to_latex.py -- lives outside codes-for-paper/ entirely, and builds the LAT table
#       from already-saved gtlike/RMFIT text output, not a fresh MC pipeline (no N_GRID/seed involved at all) --
#       out of scope for "rerun the analysis pipeline."
#   beta_lat_consistency/beta_lat_consistency.py -- a diagnostic that writes the comparison table in
#       beta_lat_consistency.md (no CSV/figure/paper table, no MC, no seed).
#   lorentz_factor/generate_lorentz_table*.py -- CSV-to-LaTeX renderers; chained by subprocess from the Lorentz-factor
#       compute scripts above, so not separate runner steps (same reason as the note on lorentz_factor.py).
#   variability_analysis/GRB*/fitter_{,un}normalized*.py, _common.py, shared_utilities.py, norris_fit.py -- exploratory
#       normalized-vs-unnormalized Norris fits (seed_registry `unused`) and shared helper modules; the canonical per-burst
#       fits are fitter_GRB<paper-name>.py above.
#   seed_table_to_latex.py, sync_paper_assets.py -- paper-output plumbing, not analysis; run these separately, after
#       this list, if the seed table or the paper repo's copies need refreshing too.
